name: Build AU Plugin (macOS)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build AU Plugin
        run: cmake --build build --config Release --target StudioRoomModeler_AU --parallel

      - name: Upload macOS AU Plugin
        uses: actions/upload-artifact@v4
        with:
          name: StudioRoomModeler-AU
          path: build/StudioRoomModeler_artefacts/Release/AU/Studio Room Modeler.component
